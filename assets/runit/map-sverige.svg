    <circle cx="122" cy="329" r="5" /><circle cx="128" cy="347" r="5" /><circle cx="101" cy="371" r="5" />
    <circle cx="93" cy="380" r="5" /><circle cx="72" cy="398" r="5" /><circle cx="61" cy="408" r="5" />
    <circle cx="51" cy="455" r="5" /><circle cx="56" cy="470" r="5" />
